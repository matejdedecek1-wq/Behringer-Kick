# tmpfiles.d(5) entries that prepare the writable layers used by etc.mount and var.mount.
# Keep these paths in sync with the upperdir/workdir options of both mount units.

d /media/kickstorage/overlay/etc/upper 0755 root root -
D /media/kickstorage/overlay/etc/work 0755 root root -

d /media/kickstorage/overlay/var/upper 0755 root root -
R /media/kickstorage/overlay/var/upper/run
D /media/kickstorage/overlay/var/work 0755 root root -
